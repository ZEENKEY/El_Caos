openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cancun Chaos Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player management
  - name: characters
    description: Character management
  - name: map
    description: Map and locations
  - name: events
    description: Game events
  - name: minigames
    description: Minigame sessions
  - name: missions
    description: Player missions
  - name: inventory
    description: Player inventory
  - name: npcs
    description: NPC management
  - name: achievements
    description: Achievements system
  - name: social
    description: Social features
  - name: admin
    description: Admin panel

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- PLAYERS ---
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create or login a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players, admin]
      summary: Delete player (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /players/{id}/summary:
    get:
      operationId: getPlayerSummary
      tags: [players]
      summary: Get "while you were away" summary for player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"

  /players/{id}/move:
    post:
      operationId: movePlayer
      tags: [players, map]
      summary: Move player to a new hex location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovePlayerBody"
      responses:
        "200":
          description: Move result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveResult"

  # --- CHARACTERS ---
  /characters/{playerId}:
    get:
      operationId: getCharacter
      tags: [characters]
      summary: Get character for player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    patch:
      operationId: updateCharacter
      tags: [characters]
      summary: Update character
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterBody"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  # --- MAP / LOCATIONS ---
  /locations:
    get:
      operationId: listLocations
      tags: [map]
      summary: List all map locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [map, admin]
      summary: Create a location (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationBody"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [map, admin]
      summary: Update a location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationBody"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      operationId: deleteLocation
      tags: [map, admin]
      summary: Delete a location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /houses:
    get:
      operationId: listHouses
      tags: [map]
      summary: List all player houses on the map
      responses:
        "200":
          description: List of houses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/House"

  /houses/{playerId}:
    get:
      operationId: getHouse
      tags: [map]
      summary: Get player's house
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: House
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/House"
    patch:
      operationId: updateHouse
      tags: [map]
      summary: Update player's house
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseBody"
      responses:
        "200":
          description: Updated house
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/House"

  /houses/{playerId}/visit:
    post:
      operationId: visitHouse
      tags: [map, social]
      summary: Visit another player's house
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitHouseBody"
      responses:
        "200":
          description: Visit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitResult"

  # --- EVENTS ---
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all game events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameEvent"
    post:
      operationId: createEvent
      tags: [events, admin]
      summary: Create a game event (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameEvent"

  /events/{id}:
    patch:
      operationId: updateEvent
      tags: [events, admin]
      summary: Update a game event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameEvent"
    delete:
      operationId: deleteEvent
      tags: [events, admin]
      summary: Delete a game event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/global:
    get:
      operationId: listGlobalEvents
      tags: [events]
      summary: List currently active global events
      responses:
        "200":
          description: Active global events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameEvent"

  /events/trigger/{playerId}:
    post:
      operationId: triggerEvent
      tags: [events]
      summary: Trigger a random event for a player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerEventBody"
      responses:
        "200":
          description: Event result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"

  # --- MINIGAMES ---
  /minigames:
    get:
      operationId: listMinigames
      tags: [minigames]
      summary: List all minigame definitions
      responses:
        "200":
          description: Minigames
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Minigame"
    post:
      operationId: createMinigame
      tags: [minigames, admin]
      summary: Create a minigame (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMinigameBody"
      responses:
        "201":
          description: Created minigame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Minigame"

  /minigames/{id}:
    patch:
      operationId: updateMinigame
      tags: [minigames, admin]
      summary: Update a minigame (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMinigameBody"
      responses:
        "200":
          description: Updated minigame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Minigame"

  /minigames/{id}/play:
    post:
      operationId: playMinigame
      tags: [minigames]
      summary: Submit minigame result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayMinigameBody"
      responses:
        "200":
          description: Play result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameResult"

  # --- MISSIONS ---
  /missions:
    get:
      operationId: listMissions
      tags: [missions]
      summary: List all missions
      responses:
        "200":
          description: Missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mission"
    post:
      operationId: createMission
      tags: [missions]
      summary: Create a mission (player or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMissionBody"
      responses:
        "201":
          description: Created mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"

  /missions/{id}:
    patch:
      operationId: updateMission
      tags: [missions, admin]
      summary: Update a mission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMissionBody"
      responses:
        "200":
          description: Updated mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
    delete:
      operationId: deleteMission
      tags: [missions, admin]
      summary: Delete a mission (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /missions/{id}/complete:
    post:
      operationId: completeMission
      tags: [missions]
      summary: Complete a mission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteMissionBody"
      responses:
        "200":
          description: Completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionResult"

  # --- INVENTORY ---
  /inventory/{playerId}:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: Get player's inventory
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: addInventoryItem
      tags: [inventory]
      summary: Add item to inventory
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddInventoryItemBody"
      responses:
        "201":
          description: Added item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{playerId}/{itemId}:
    delete:
      operationId: removeInventoryItem
      tags: [inventory]
      summary: Remove item from inventory
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # --- NPCs ---
  /npcs:
    get:
      operationId: listNpcs
      tags: [npcs]
      summary: List all NPCs
      responses:
        "200":
          description: NPCs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Npc"
    post:
      operationId: createNpc
      tags: [npcs, admin]
      summary: Create an NPC (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNpcBody"
      responses:
        "201":
          description: Created NPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"

  /npcs/{id}:
    patch:
      operationId: updateNpc
      tags: [npcs, admin]
      summary: Update an NPC (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNpcBody"
      responses:
        "200":
          description: Updated NPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
    delete:
      operationId: deleteNpc
      tags: [npcs, admin]
      summary: Delete an NPC (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # --- ACHIEVEMENTS ---
  /achievements:
    get:
      operationId: listAchievements
      tags: [achievements]
      summary: List all achievements
      responses:
        "200":
          description: Achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"

  /achievements/{playerId}:
    get:
      operationId: getPlayerAchievements
      tags: [achievements]
      summary: Get player achievements
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerAchievement"

  # --- SOCIAL ---
  /social/gossip:
    get:
      operationId: listGossip
      tags: [social]
      summary: Get latest absurd gossip/stories
      responses:
        "200":
          description: Gossip items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GossipItem"
    post:
      operationId: generateGossip
      tags: [social]
      summary: Generate new gossip for a player action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateGossipBody"
      responses:
        "201":
          description: Generated gossip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GossipItem"

  /social/decisions/{playerId}:
    get:
      operationId: getPlayerDecisions
      tags: [social]
      summary: Get pending decisions for a player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pending decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"
    post:
      operationId: makeDecision
      tags: [social]
      summary: Make a decision
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakeDecisionBody"
      responses:
        "200":
          description: Decision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"

  # --- ADMIN ---
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get overall game stats (admin)
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/logs:
    get:
      operationId: getAdminLogs
      tags: [admin]
      summary: Get game activity logs (admin)
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameLog"

  /traits:
    get:
      operationId: listTraits
      tags: [players]
      summary: List all personality traits
      responses:
        "200":
          description: Traits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trait"

  /traits/{playerId}:
    get:
      operationId: getPlayerTraits
      tags: [players]
      summary: Get player's personality traits
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player traits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerTrait"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Player:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        money:
          type: integer
        energy:
          type: integer
        reputation:
          type: integer
        currentHexQ:
          type: integer
        currentHexR:
          type: integer
        lastSeen:
          type: string
        createdAt:
          type: string
      required:
        - id
        - username
        - money
        - energy
        - reputation
        - currentHexQ
        - currentHexR
        - lastSeen
        - createdAt

    CreatePlayerBody:
      type: object
      properties:
        username:
          type: string
      required:
        - username

    UpdatePlayerBody:
      type: object
      properties:
        money:
          type: integer
        energy:
          type: integer
        reputation:
          type: integer

    PlayerSummary:
      type: object
      properties:
        playerId:
          type: integer
        moneyGained:
          type: integer
        moneyLost:
          type: integer
        eventsOccurred:
          type: array
          items:
            type: string
        visitorsCount:
          type: integer
        missionsCompleted:
          type: integer
        headline:
          type: string
      required:
        - playerId
        - moneyGained
        - moneyLost
        - eventsOccurred
        - visitorsCount
        - missionsCompleted
        - headline

    MovePlayerBody:
      type: object
      properties:
        hexQ:
          type: integer
        hexR:
          type: integer
      required:
        - hexQ
        - hexR

    MoveResult:
      type: object
      properties:
        success:
          type: boolean
        newHexQ:
          type: integer
        newHexR:
          type: integer
        energyUsed:
          type: integer
        locationName:
          type: ["string", "null"]
        eventTriggered:
          type: ["string", "null"]
      required:
        - success
        - newHexQ
        - newHexR
        - energyUsed
        - locationName
        - eventTriggered

    Character:
      type: object
      properties:
        id:
          type: integer
        playerId:
          type: integer
        name:
          type: string
        avatarEmoji:
          type: string
        skinTone:
          type: string
        hairStyle:
          type: string
        outfit:
          type: string
        bio:
          type: string
      required:
        - id
        - playerId
        - name
        - avatarEmoji
        - skinTone
        - hairStyle
        - outfit
        - bio

    UpdateCharacterBody:
      type: object
      properties:
        name:
          type: string
        avatarEmoji:
          type: string
        skinTone:
          type: string
        hairStyle:
          type: string
        outfit:
          type: string
        bio:
          type: string

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        hexQ:
          type: integer
        hexR:
          type: integer
        emoji:
          type: string
        description:
          type: string
        riskLevel:
          type: integer
        energyRestore:
          type: integer
        minigameId:
          type: ["integer", "null"]
      required:
        - id
        - name
        - type
        - hexQ
        - hexR
        - emoji
        - description
        - riskLevel
        - energyRestore

    CreateLocationBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        hexQ:
          type: integer
        hexR:
          type: integer
        emoji:
          type: string
        description:
          type: string
        riskLevel:
          type: integer
        energyRestore:
          type: integer
